name: Weekly Friday Sobha Neopolis Real Estate Crawler & CI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Runs every Friday at 8:00 PM IST (14:30 UTC)
    - cron: '30 14 * * 5'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  test-and-crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit updated data back to repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas beautifulsoup4

      - name: Run Python Backend Unit Tests
        run: |
          python -m unittest test_crawler.py

      - name: Run Node.js Frontend Unit Tests
        run: |
          node test_frontend.js

      - name: Run NoBroker Sobha Neopolis Crawler
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python parse_nobroker_complete.py

      - name: Commit and Push updated listing data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sobha_listings.json sobha_listings.csv sobha_history.json data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Sobha project listings [Scheduled/Manual Run]" && git push)
